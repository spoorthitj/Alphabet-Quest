<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alphabet Quest — Welcome!</title>
  <meta name="description" content="Join Hoot the Owl and Squibb the Cat on an alphabet adventure! Login or register to start playing.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/login.css">
</head>

<body>
  <!-- Floating bubbles background -->
  <div class="bubbles" aria-hidden="true">
    <span class="bubble">🌟</span>
    <span class="bubble">⭐</span>
    <span class="bubble">🎈</span>
    <span class="bubble">🌈</span>
    <span class="bubble">✨</span>
    <span class="bubble">🎉</span>
    <span class="bubble">🦋</span>
    <span class="bubble">🌸</span>
    <span class="bubble">🍀</span>
    <span class="bubble">🎀</span>
  </div>

  <div class="login-wrap">

    <!-- Header -->
    <div class="login-header">
      <h1 class="logo-text">Alphabet Quest</h1>
      <p class="logo-sub">The Magical Learning Adventure!</p>
    </div>

    <!-- Mascot Stage -->
    <div class="mascot-stage">
      <!-- Hoot the Owl -->
      <div class="mascot-char" id="hootChar">
        <svg class="mascot-svg bounce-anim" viewBox="0 0 100 120" aria-label="Hoot the Owl">
          <!-- Body -->
          <ellipse cx="50" cy="80" rx="36" ry="32" fill="#8B6DF0"/>
          <!-- Wings -->
          <ellipse cx="16" cy="82" rx="14" ry="10" fill="#7B5CE0" transform="rotate(-20 16 82)"/>
          <ellipse cx="84" cy="82" rx="14" ry="10" fill="#7B5CE0" transform="rotate(20 84 82)"/>
          <!-- Head -->
          <ellipse cx="50" cy="44" rx="26" ry="24" fill="#8B6DF0"/>
          <!-- Ears -->
          <polygon points="28,25 22,8 36,22" fill="#7B5CE0"/>
          <polygon points="72,25 78,8 64,22" fill="#7B5CE0"/>
          <!-- Ear tufts -->
          <polygon points="29,22 24,10 34,20" fill="#FFC93D"/>
          <polygon points="71,22 76,10 66,20" fill="#FFC93D"/>
          <!-- Eye whites -->
          <circle cx="37" cy="44" r="12" fill="white"/>
          <circle cx="63" cy="44" r="12" fill="white"/>
          <!-- Eyes -->
          <circle class="eye-pupil" cx="37" cy="44" r="6" fill="#2B2140"/>
          <circle class="eye-pupil" cx="63" cy="44" r="6" fill="#2B2140"/>
          <!-- Eye shine -->
          <circle cx="39" cy="41" r="2" fill="white"/>
          <circle cx="65" cy="41" r="2" fill="white"/>
          <!-- Beak -->
          <polygon points="46,52 54,52 50,60" fill="#FFC93D"/>
          <!-- Belly -->
          <ellipse cx="50" cy="88" rx="22" ry="18" fill="#C8B4F8" opacity="0.6"/>
          <!-- Feet -->
          <ellipse cx="38" cy="110" rx="8" ry="4" fill="#FFC93D"/>
          <ellipse cx="62" cy="110" rx="8" ry="4" fill="#FFC93D"/>
        </svg>
        <div class="char-name">Hoot 🦉</div>
      </div>

      <!-- Speech bubble -->
      <div class="speech-bubble" id="speechBubble">
        <span id="bubbleText">Hey there! Ready to go on an alphabet adventure? 🌟</span>
      </div>

      <!-- Squibb the Cat -->
      <div class="mascot-char" id="squibbChar">
        <svg class="mascot-svg bounce-anim-delay" viewBox="0 0 100 120" aria-label="Squibb the Cat">
          <!-- Body -->
          <ellipse cx="50" cy="82" rx="34" ry="30" fill="#FF6B5B"/>
          <!-- Tail -->
          <path d="M82 95 Q105 80 100 60 Q95 40 85 55" stroke="#FF4A38" stroke-width="8" fill="none" stroke-linecap="round"/>
          <!-- Head -->
          <ellipse cx="50" cy="44" rx="28" ry="25" fill="#FF6B5B"/>
          <!-- Ears -->
          <polygon points="25,26 18,5 38,22" fill="#FF6B5B"/>
          <polygon points="75,26 82,5 62,22" fill="#FF6B5B"/>
          <polygon points="27,23 22,9 36,21" fill="#FFB3AD"/>
          <polygon points="73,23 78,9 64,21" fill="#FFB3AD"/>
          <!-- Eyes -->
          <ellipse cx="37" cy="43" r="9" fill="#2B2140"/>
          <ellipse cx="63" cy="43" r="9" fill="#2B2140"/>
          <!-- Eye shine -->
          <circle cx="39" cy="40" r="2.5" fill="white"/>
          <circle cx="65" cy="40" r="2.5" fill="white"/>
          <!-- Nose -->
          <ellipse cx="50" cy="53" rx="4" ry="3" fill="#FF4A38"/>
          <!-- Smile -->
          <path d="M43 58 Q50 65 57 58" stroke="#2B2140" stroke-width="2.5" fill="none" stroke-linecap="round"/>
          <!-- Whiskers -->
          <line x1="8" y1="52" x2="38" y2="56" stroke="#2B2140" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="8" y1="58" x2="38" y2="58" stroke="#2B2140" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="62" y1="56" x2="92" y2="52" stroke="#2B2140" stroke-width="1.5" stroke-linecap="round"/>
          <line x1="62" y1="58" x2="92" y2="58" stroke="#2B2140" stroke-width="1.5" stroke-linecap="round"/>
          <!-- Belly -->
          <ellipse cx="50" cy="88" rx="20" ry="16" fill="#FFB3AD" opacity="0.7"/>
          <!-- Paws -->
          <ellipse cx="36" cy="108" rx="9" ry="5" fill="#FF4A38"/>
          <ellipse cx="64" cy="108" rx="9" ry="5" fill="#FF4A38"/>
        </svg>
        <div class="char-name">Squibb 🐱</div>
      </div>
    </div>

    <!-- Auth Card -->
    <div class="auth-card" id="authCard">

      <!-- Tab switcher -->
      <div class="auth-tabs" role="tablist">
        <button class="tab-btn active" id="loginTab" role="tab" aria-selected="true" aria-controls="loginPanel" onclick="switchTab('login')">
          🔓 Login
        </button>
        <button class="tab-btn" id="registerTab" role="tab" aria-selected="false" aria-controls="registerPanel" onclick="switchTab('register')">
          🌟 Register
        </button>
      </div>

      <!-- LOGIN PANEL -->
      <div class="tab-panel active" id="loginPanel" role="tabpanel">
        <p class="panel-hint">Welcome back, adventurer! 🎒</p>
        <div class="form-group">
          <label for="loginName">Your Name</label>
          <div class="input-wrap">
            <span class="input-icon">👤</span>
            <input type="text" id="loginName" placeholder="e.g. Alex" autocomplete="given-name" maxlength="30">
          </div>
        </div>
        <div class="form-group">
          <label for="loginPhone">Phone Number</label>
          <div class="input-wrap">
            <span class="input-icon">📱</span>
            <input type="tel" id="loginPhone" placeholder="e.g. 9876543210" autocomplete="tel" maxlength="15">
          </div>
        </div>
        <div class="error-msg" id="loginError" role="alert" aria-live="polite"></div>
        <button class="auth-btn" id="loginBtn" onclick="handleLogin()">
          <span class="btn-emoji">🚀</span> Let's Play!
        </button>
        <p class="switch-hint">New here? <a href="#" onclick="switchTab('register'); return false;">Create an account →</a></p>
      </div>

      <!-- REGISTER PANEL -->
      <div class="tab-panel" id="registerPanel" role="tabpanel">
        <p class="panel-hint">Join the adventure today! 🌈</p>
        <div class="form-group">
          <label for="regName">Your Name</label>
          <div class="input-wrap">
            <span class="input-icon">👤</span>
            <input type="text" id="regName" placeholder="e.g. Alex" autocomplete="given-name" maxlength="30">
          </div>
        </div>
        <div class="form-group">
          <label for="regPhone">Phone Number</label>
          <div class="input-wrap">
            <span class="input-icon">📱</span>
            <input type="tel" id="regPhone" placeholder="e.g. 9876543210" autocomplete="tel" maxlength="15">
          </div>
        </div>
        <div class="error-msg" id="regError" role="alert" aria-live="polite"></div>
        <button class="auth-btn" id="registerBtn" onclick="handleRegister()">
          <span class="btn-emoji">🌟</span> Start Adventure!
        </button>
        <p class="switch-hint">Already playing? <a href="#" onclick="switchTab('login'); return false;">Login →</a></p>
      </div>

    </div><!-- /auth-card -->

    <!-- Alphabet decorations -->
    <div class="alpha-deco" aria-hidden="true">
      <span>A</span><span>B</span><span>C</span><span>D</span><span>E</span>
      <span>F</span><span>G</span><span>H</span><span>I</span><span>J</span>
    </div>

  </div><!-- /login-wrap -->

  <!-- Hidden SVG defs (reused) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <filter id="glow">
        <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
        <feMerge>
          <feMergeNode in="coloredBlur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
  </svg>

  <script>
    // ─── Utilities ───────────────────────────────────────────────────────────
    const USERS_KEY = 'aq_users';
    const SESSION_KEY = 'aq_session';

    function getUsers() {
      try { return JSON.parse(localStorage.getItem(USERS_KEY)) || {}; }
      catch { return {}; }
    }
    function saveUsers(users) {
      localStorage.setItem(USERS_KEY, JSON.stringify(users));
    }
    function setSession(name, phone) {
      localStorage.setItem(SESSION_KEY, JSON.stringify({ name, phone, ts: Date.now() }));
    }

    // If already logged in, go straight to game
    (function checkSession() {
      const s = localStorage.getItem(SESSION_KEY);
      if (s) {
        try {
          const { name } = JSON.parse(s);
          if (name) {
            showWelcomeFlash(name, () => window.location.href = 'index.html');
            return;
          }
        } catch {}
      }
    })();

    // ─── Tab switching ────────────────────────────────────────────────────────
    function switchTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('loginTab').classList.toggle('active', isLogin);
      document.getElementById('registerTab').classList.toggle('active', !isLogin);
      document.getElementById('loginPanel').classList.toggle('active', isLogin);
      document.getElementById('registerPanel').classList.toggle('active', !isLogin);
      clearErrors();
      // Update mascot speech
      const msgs = {
        login: "Welcome back! I've been waiting for you! 🎉",
        register: "Ooh, a new adventurer! Hoot loves new friends! 🦉"
      };
      setBubble(msgs[tab]);
    }

    // ─── Bubble messages ─────────────────────────────────────────────────────
    const bubbleMessages = [
      "Hey there! Ready to go on an alphabet adventure? 🌟",
      "Squibb loves learning letters! Let's go! 🐱",
      "Hoot knows all 26 letters by heart! 📚",
      "Join us — it's going to be SO much fun! 🎈"
    ];
    let msgIdx = 0;
    function setBubble(text) {
      const el = document.getElementById('bubbleText');
      el.style.opacity = '0';
      setTimeout(() => { el.textContent = text; el.style.opacity = '1'; }, 200);
    }
    setInterval(() => {
      msgIdx = (msgIdx + 1) % bubbleMessages.length;
      if (!document.querySelector('.tab-btn.active')?.id.includes('register')) {
        setBubble(bubbleMessages[msgIdx]);
      }
    }, 3500);

    // ─── Validation ──────────────────────────────────────────────────────────
    function validateName(name) {
      if (!name.trim()) return 'Please enter your name 😊';
      if (name.trim().length < 2) return 'Name must be at least 2 characters';
      return null;
    }
    function validatePhone(phone) {
      const clean = phone.replace(/\D/g, '');
      if (!clean) return 'Please enter your phone number 📱';
      if (clean.length < 7 || clean.length > 15) return 'Enter a valid phone number (7–15 digits)';
      return null;
    }
    function clearErrors() {
      ['loginError', 'regError'].forEach(id => {
        const el = document.getElementById(id);
        el.textContent = '';
        el.classList.remove('visible');
      });
    }
    function showError(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.classList.add('visible');
    }

    // ─── Welcome flash overlay ────────────────────────────────────────────────
    function showWelcomeFlash(name, callback) {
      const overlay = document.createElement('div');
      overlay.className = 'welcome-overlay';
      overlay.innerHTML = `
        <div class="welcome-box">
          <div class="welcome-emoji">🎉</div>
          <h2>Welcome, ${name}!</h2>
          <p>Get ready for an amazing alphabet adventure!</p>
          <div class="welcome-bar"><div class="welcome-bar-fill"></div></div>
        </div>`;
      document.body.appendChild(overlay);
      requestAnimationFrame(() => overlay.classList.add('show'));
      setTimeout(callback, 1800);
    }

    // ─── Handlers ────────────────────────────────────────────────────────────
    function handleLogin() {
      clearErrors();
      const name = document.getElementById('loginName').value.trim();
      const phone = document.getElementById('loginPhone').value.trim();
      const nameErr = validateName(name);
      if (nameErr) { showError('loginError', nameErr); return; }
      const phoneErr = validatePhone(phone);
      if (phoneErr) { showError('loginError', phoneErr); return; }

      const users = getUsers();
      const key = phone.replace(/\D/g, '');
      const user = users[key];

      if (!user) {
        showError('loginError', "No account found. Please register first! 🌟");
        setBubble("Hmm, I don't recognise you! Register to join us! 🦉");
        return;
      }
      if (user.name.toLowerCase() !== name.toLowerCase()) {
        showError('loginError', "Name doesn't match our records. Try again! 🤔");
        setBubble("That name doesn't match what I remember... 🧐");
        return;
      }

      setSession(user.name, key);
      setBubble(`Yay, ${user.name} is back! Let's play! 🎉`);
      animateBtn('loginBtn', () => showWelcomeFlash(user.name, () => window.location.href = 'index.html'));
    }

    function handleRegister() {
      clearErrors();
      const name = document.getElementById('regName').value.trim();
      const phone = document.getElementById('regPhone').value.trim();
      const nameErr = validateName(name);
      if (nameErr) { showError('regError', nameErr); return; }
      const phoneErr = validatePhone(phone);
      if (phoneErr) { showError('regError', phoneErr); return; }

      const users = getUsers();
      const key = phone.replace(/\D/g, '');

      if (users[key]) {
        showError('regError', "This phone is already registered! Try logging in. 😊");
        setBubble("I already know that number! Try logging in! 🦉");
        return;
      }

      users[key] = { name, phone: key, joined: Date.now() };
      saveUsers(users);
      setSession(name, key);
      setBubble(`Welcome, ${name}! Hoot & Squibb are so happy! 🎊`);
      animateBtn('registerBtn', () => showWelcomeFlash(name, () => window.location.href = 'index.html'));
    }

    function animateBtn(id, callback) {
      const btn = document.getElementById(id);
      btn.classList.add('btn-loading');
      btn.disabled = true;
      setTimeout(callback, 600);
    }

    // ─── Enter key support ────────────────────────────────────────────────────
    document.addEventListener('keydown', e => {
      if (e.key === 'Enter') {
        const activePanel = document.querySelector('.tab-panel.active');
        if (activePanel.id === 'loginPanel') handleLogin();
        else handleRegister();
      }
    });

    // ─── Wiggle mascots on input focus ───────────────────────────────────────
    document.querySelectorAll('input').forEach(inp => {
      inp.addEventListener('focus', () => {
        document.getElementById('hootChar').querySelector('svg').classList.add('wiggle');
        setTimeout(() => document.getElementById('hootChar').querySelector('svg').classList.remove('wiggle'), 600);
      });
    });
  </script>
</body>
</html>
